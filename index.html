<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is required for the safe-area (notch / home bar) padding used in the layout -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0e0d0b" />

    <!-- Browser / tab icon -->
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />

    <!-- iOS "Add to Home Screen" -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Visual Frames" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />

    <!-- Page Title -->
    <title>Visual Frames — Photography &amp; Videography</title>

    <!-- SEO Description -->
    <meta
      name="description"
      content="Visual Frames is a photography and videography studio capturing your moments as timeless visual stories."
    />

    <!-- Open Graph. __SITE_URL__ is filled in at build time by vite.config (see README) -->
    <meta
      property="og:title"
      content="Visual Frames — Photography & Videography"
    />
    <meta
      property="og:description"
      content="Photography and videography that turns your moments into timeless visual stories."
    />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://visual-frames-prototype.vercel.app/" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="Visual Frames — Photography & Videography"
    />
    <meta
      name="twitter:description"
      content="Photography and videography that turns your moments into timeless visual stories."
    />
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500;600&family=Outfit:wght@300;400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
